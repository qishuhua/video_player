<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <title>告警视频回放</title>
  <style>
    :root{color-scheme:dark;--bg:#080f1e;--panel:#121c30;--line:#2b3850;--text:#e9f0fc;--muted:#a3b2c9;--blue:#5aaaff;--ok:#59dda8;--red:#ff8080}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
    body{background:radial-gradient(ellipse 1400px 650px at 50% -250px,#19355f 0%,#080f1e 72%)}
    .shell{max-width:1170px;margin:auto;padding:26px 24px 60px}
    .top{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:22px}
    h1{margin:0;font-size:24px;font-weight:700;letter-spacing:.3px}
    .card{border:1px solid var(--line);background:var(--panel);border-radius:16px;overflow:hidden;box-shadow:0 20px 60px #0005}
    .frame{width:100%;aspect-ratio:16/9;position:relative;background:#000;overflow:hidden;isolation:isolate}
    .frame video,.frame .overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
    .frame video{z-index:1;background:#000;outline:0}
    .frame .overlay{z-index:2;pointer-events:none;user-select:none;-webkit-user-drag:none;transition:opacity .12s}
    .frame .overlay.off{opacity:0!important}
    /* 普通模式：视频和轨迹单独占据画面，播放控件位于画面下方。 */
    .player-stage{background:#000}
    .media-controls{position:relative;display:flex;flex-direction:column;gap:5px;
      padding:8px 14px 12px;background:#152239;border-top:1px solid var(--line);color:#fff}
    .media-controls .seek{width:100%;height:18px;min-width:0;cursor:pointer;accent-color:#56adff}
    /* 无音频视频：四个固定控件，播放/暂停不会改变布局。 */
    .media-actions{display:grid;grid-template-columns:42px max-content 68px 48px;justify-content:space-between;
      align-items:center;gap:8px;min-height:40px}
    .media-actions button,.media-actions select{font:inherit;cursor:pointer;padding:5px 4px;background:#101b2d;
      border:1px solid #ffffff55;border-radius:7px;color:#fff;min-height:40px;min-width:0;width:100%}
    .media-actions button:hover{background:#245080}
    .media-actions .time{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12px}
    .media-actions .push{margin-left:0}
    .frame video{cursor:pointer}
    /* 全屏整个播放器：视频与 SVG 保持同步缩放，控件仍位于画面外。 */
    .player-stage:fullscreen,.player-stage:-webkit-full-screen,.player-stage.is-pseudo-fullscreen{
      width:100vw!important;height:100vh!important;height:100dvh!important;
      display:flex;flex-direction:column;background:#000;overflow:hidden
    }
    .player-stage.is-pseudo-fullscreen{position:fixed!important;inset:0;z-index:99999;max-width:none}
    .player-stage:fullscreen .frame,.player-stage:-webkit-full-screen .frame,.player-stage.is-pseudo-fullscreen .frame{
      flex:1 1 0;min-height:0;width:100%;aspect-ratio:auto!important
    }
    .player-stage:fullscreen .media-controls,.player-stage:-webkit-full-screen .media-controls,
    .player-stage.is-pseudo-fullscreen .media-controls{
      flex-shrink:0;padding-bottom:max(12px,env(safe-area-inset-bottom));
      padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))
    }
    body.lock-scroll{overflow:hidden}
    @media(max-width:520px){
      .media-controls{padding:8px 10px 12px}
      .media-actions{grid-template-columns:36px max-content 60px 36px;gap:4px}
      .media-actions .time{font-size:11px;letter-spacing:-.2px}
      .media-actions button,.media-actions select{padding:5px 2px}
    }
    /* 只在极窄屏固定采用两行，避免超出容器。 */
    @media(max-width:260px){
      .media-actions{grid-template-columns:36px minmax(0,1fr) 36px;row-gap:8px}
      #playPause{grid-column:1;grid-row:1}
      .media-actions .time{grid-column:2;grid-row:1;justify-self:center}
      #playbackRate{grid-column:2;grid-row:2}
      #fullScreenInPlayer{grid-column:3;grid-row:1}
    }
    .controls{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
    .controls-left,.controls-right{display:flex;align-items:center;gap:13px;flex-wrap:wrap}.controls small{color:var(--muted)}
    label.switch{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
    input[type=checkbox]{accent-color:#3f9fff;width:17px;height:17px}
    input[type=range]{accent-color:#3f9fff;width:96px}
    button{cursor:pointer;border:1px solid #3e526c;color:var(--text);background:#223652;padding:9px 14px;border-radius:9px;font:inherit}
    button:hover{background:#2e4668}
    .status{color:var(--muted);margin-top:13px;font-size:13px;min-height:19px;overflow-wrap:anywhere}
    .status:empty{display:none}.status.err{color:var(--red)}
    @media(max-width:680px){.shell{padding:14px 9px 40px}.top{margin:2px 8px 14px}h1{font-size:19px}.controls{padding:12px}}
  </style>
</head>
<body>
<main class="shell">
  <header class="top">
    <h1>告警视频回放</h1>
  </header>
  <section class="card">
    <div class="player-stage" id="playerStage">
      <div class="frame" id="frame">
        <!-- 画面区域只显示视频与 SVG 轨迹，不覆盖播放控件。 -->
        <video id="video" preload="metadata" playsinline webkit-playsinline disablepictureinpicture></video>
        <img id="overlay" class="overlay" alt="检测区域与轨迹叠加图层" draggable="false" />
      </div>
      <div class="media-controls" aria-label="视频播放控制">
        <input id="seek" class="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="播放进度" />
        <div class="media-actions">
          <button id="playPause" type="button" aria-label="播放" title="播放">▶</button>
          <span class="time" id="timeDisplay">00:00 / 00:00</span>
          <select id="playbackRate" aria-label="播放倍速" title="播放倍速">
            <option value="0.5">0.5×</option>
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2×</option>
            <option value="3">3×</option>
            <option value="4">4×</option>
          </select>
          <button id="fullScreenInPlayer" type="button" class="push" aria-label="进入全屏" title="进入全屏">⛶</button>
        </div>
      </div>
    </div>
    <div class="controls">
      <div class="controls-left">
        <label class="switch"><input type="checkbox" id="showOverlay" checked>显示轨迹</label>
        <label class="switch"><span style="color:var(--muted)">透明度</span><input type="range" id="opacity" min="0" max="100" value="100" step="5"></label>
      </div>
      <div class="controls-right"><small id="dimensions">视频尺寸：—</small></div>
    </div>
  </section>
  <p id="status" class="status" role="status" aria-live="polite"></p>
</main>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const video = $('video');
  const overlay = $('overlay');
  const frame = $('frame');
  const playerStage = $('playerStage');
  const status = $('status');
  let pseudoFullscreen = false;
  let seeking = false;

  function message(text, type = '') {
    status.textContent = text;
    status.className = 'status' + (type ? ' ' + type : '');
  }
  function validUrl(value, optional = false) {
    const s = String(value || '').trim();
    if (!s && optional) return '';
    if (!s) throw Error('必须填写 MP4 和 SVG URL');
    let u;
    try { u = new URL(s); } catch { throw Error('URL 格式无效：' + s.slice(0, 90)); }
    if (u.protocol !== 'https:' && u.protocol !== 'http:') throw Error('仅允许 http/https URL');
    return u.href;
  }
  function reset() {
    video.pause();
    video.removeAttribute('src');
    video.removeAttribute('poster');
    overlay.removeAttribute('src');
    video.load();
    $('dimensions').textContent = '视频尺寸：—';
    frame.style.aspectRatio = '16 / 9';
    $('seek').value = '0';
    $('timeDisplay').textContent = '00:00 / 00:00';
    updatePlayButton();
  }
  function loadSource(src, poster, svg) {
    reset();
    if (poster) video.poster = poster;
    overlay.src = svg;
    video.src = src;
    video.load();
  }
  $('showOverlay').addEventListener('change', () => {
    overlay.classList.toggle('off', !$('showOverlay').checked);
  });
  $('opacity').addEventListener('input', () => {
    overlay.style.opacity = String(Number($('opacity').value) / 100);
  });
  // 对视频与轨迹图层的共同父容器启用全屏。
  function isFullscreen() { return !!document.fullscreenElement || pseudoFullscreen; }
  function syncFullscreenButtons() {
    const full = isFullscreen();
    const button = $('fullScreenInPlayer');
    const label = full ? '退出全屏' : '进入全屏';
    button.textContent = full ? '⤡' : '⛶';
    button.setAttribute('aria-label', label);
    button.title = label;
  }
  async function toggleFullscreen() {
    if (pseudoFullscreen) {
      pseudoFullscreen = false;
      playerStage.classList.remove('is-pseudo-fullscreen');
      document.body.classList.remove('lock-scroll');
    } else if (document.fullscreenElement) {
      try { await document.exitFullscreen(); } catch(e) { message('退出全屏失败：' + e.message, 'err'); }
    } else {
      let entered = false;
      if (playerStage.requestFullscreen) {
        try { await playerStage.requestFullscreen(); entered = true; }
        catch(e) { /* 不支持原生全屏时使用 CSS 全屏。 */ }
      }
      if (!entered) {
        pseudoFullscreen = true;
        playerStage.classList.add('is-pseudo-fullscreen');
        document.body.classList.add('lock-scroll');
      }
    }
    syncFullscreenButtons();
  }
  $('fullScreenInPlayer').addEventListener('click', toggleFullscreen);
  document.addEventListener('fullscreenchange', syncFullscreenButtons);
  document.addEventListener('webkitfullscreenchange', syncFullscreenButtons);
  function formatTime(seconds) {
    if (!Number.isFinite(seconds)) return '00:00';
    const total = Math.max(0, Math.floor(seconds));
    const sec = String(total % 60).padStart(2, '0');
    const mins = Math.floor(total / 60);
    return mins >= 60 ? `${Math.floor(mins/60)}:${String(mins%60).padStart(2,'0')}:${sec}` : `${String(mins).padStart(2,'0')}:${sec}`;
  }
  function updatePlayButton() {
    const playing = !video.paused && !video.ended;
    const button = $('playPause');
    const label = playing ? '暂停' : '播放';
    button.textContent = playing ? '❚❚' : '▶';
    button.setAttribute('aria-label', label);
    button.title = label;
  }
  function updateTimeline() {
    const duration = video.duration;
    const current = video.currentTime || 0;
    if (!seeking) $('seek').value = Number.isFinite(duration) && duration > 0 ? String(Math.round(current / duration * 1000)) : '0';
    $('timeDisplay').textContent = formatTime(current) + ' / ' + formatTime(duration);
  }
  function togglePlay() {
    if (!video.src) return;
    if (video.paused || video.ended) video.play().catch(e => message('播放失败：' + e.message, 'err'));
    else video.pause();
  }
  $('playPause').addEventListener('click', togglePlay);
  video.addEventListener('click', togglePlay);
  video.addEventListener('dblclick', e => { e.preventDefault(); toggleFullscreen(); });
  for (const ev of ['loadedmetadata', 'durationchange', 'timeupdate', 'seeked', 'emptied']) {
    video.addEventListener(ev, updateTimeline);
  }
  for (const ev of ['play', 'pause', 'ended', 'emptied']) {
    video.addEventListener(ev, updatePlayButton);
  }
  $('seek').addEventListener('input', () => {
    const duration = video.duration;
    if (Number.isFinite(duration) && duration > 0) {
      seeking = true;
      video.currentTime = Number($('seek').value) / 1000 * duration;
      $('timeDisplay').textContent = formatTime(video.currentTime) + ' / ' + formatTime(duration);
    }
  });
  $('seek').addEventListener('change', () => { seeking = false; updateTimeline(); });
  $('seek').addEventListener('pointerup', () => { seeking = false; updateTimeline(); });
  $('playbackRate').addEventListener('change', () => {
    const rate = Number($('playbackRate').value);
    video.defaultPlaybackRate = rate;
    video.playbackRate = rate;
  });
  video.addEventListener('ratechange', () => {
    $('playbackRate').value = String(video.playbackRate);
  });
  // Esc 关闭 CSS 全屏，原生全屏由浏览器关闭。
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && pseudoFullscreen) { toggleFullscreen(); return; }
    if (['INPUT', 'TEXTAREA', 'SELECT', 'BUTTON'].includes(document.activeElement?.tagName)) return;
    if (e.code === 'Space' && !e.repeat) { e.preventDefault(); togglePlay(); }
  });
  overlay.addEventListener('error', () => {
    message('轨迹加载失败，请刷新重试。', 'err');
  });
  video.addEventListener('loadedmetadata', () => {
    if (video.videoWidth && video.videoHeight) {
      frame.style.aspectRatio = video.videoWidth + ' / ' + video.videoHeight;
      $('dimensions').textContent = `视频尺寸：${video.videoWidth} × ${video.videoHeight}`;
    }
  });
  video.addEventListener('error', () => {
    const code = video.error && video.error.code;
    message(`视频无法播放（错误码 ${code ?? '未知'}），请刷新重试。`, 'err');
  });
  // 播放地址只经 URL 参数传入（飞书告警卡片跳转），页面上不提供输入与本地文件入口。
  const query = new URLSearchParams(location.search);
  if (query.has('video')) {
    try {
      loadSource(validUrl(query.get('video')), validUrl(query.get('image'), true), validUrl(query.get('overlay')));
      if (query.get('autoplay') === '1') {
        // 浏览器普遍阻止有声自动播放，仅尝试静音自动播放。
        video.muted = true;
        video.play().catch(() => message('浏览器阻止了自动播放，请手动点击视频播放按钮。'));
      }
    } catch (e) { message('参数无效，请从飞书告警消息重新进入：' + e.message, 'err'); }
  }
})();
</script>
</body>
</html>
