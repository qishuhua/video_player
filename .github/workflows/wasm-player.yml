name: Build WASM player
on:
  push:
    branches: [main]
    paths:
      - 'wasm-player/**'
      - '.github/workflows/wasm-player.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to GitHub Pages (enable Pages GitHub Actions source first)
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site preserving existing player
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/site"
          rm -rf "$RUNNER_TEMP/site/.github" "$RUNNER_TEMP/site/wasm-player"
          mkdir -p "$RUNNER_TEMP/site/wasm-player"
          touch "$RUNNER_TEMP/site/.nojekyll"
      - name: Build FFmpeg WASM
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/site:/site" \
            -w /src emscripten/emsdk:3.1.64 bash wasm-player/build.sh /site/wasm-player
      - name: Verify JS syntax and output
        run: |
          test -s "$RUNNER_TEMP/site/wasm-player/decoder.wasm"
          for f in player renderer; do
            node --input-type=module --check < "$RUNNER_TEMP/site/wasm-player/$f.js"
          done
          node --check "$RUNNER_TEMP/site/wasm-player/decoder.worker.js"
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-player-site
          path: ${{ runner.temp }}/site
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        with:
          path: ${{ runner.temp }}/site
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
